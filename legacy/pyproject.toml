[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ihg"
version = "0.1.0"
description = "Interactive shell history browser and runner"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ihg contributors" }]

[project.scripts]
ihg = "ihg.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ihg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
