version: 2

project_name: ihg

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: ihg
    main: ./cmd/ihg
    binary: ihg
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: ihg
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Docs?:"
      - "^Tests?:"
